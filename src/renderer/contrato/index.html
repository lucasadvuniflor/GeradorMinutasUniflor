<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Contratos – Uniflor/PR</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="contrato.css" />
</head>
<body>

<div class="app-shell">
<aside id="app-sidebar"></aside>
<div class="app-main">

<header class="page-header">
  <div class="page-heading">
    <div class="page-title">Contrato</div>
    <div class="page-sub">Anexo III do Edital · cláusulas do art. 92 da Lei nº 14.133/2021 por tipo de contratação</div>
  </div>
</header>

<div class="progress-bar" id="progressBar"></div>

<div id="card-importar-edital" class="alert alert-info" style="display:none;">
  <div>
    <strong>Dados do Edital <span id="importar-edital-label"></span> encontrados.</strong> Importar nº do processo/licitação, modalidade, objeto e departamento para este Contrato?
    <div style="margin-top:8px; display:flex; gap:10px;">
      <button id="btn-importar-edital" class="btn btn-primary">Importar dados do Edital</button>
      <button id="btn-ignorar-edital" class="btn btn-secondary">Ignorar</button>
    </div>
  </div>
</div>

<div id="sidebar"></div>
<div class="content" id="content"></div>

</div>
</div>

<script src="../shared/shell.js"></script>
<script src="../../sancoes-biblioteca.js"></script>
<script src="app.js"></script>
</body>
</html>
